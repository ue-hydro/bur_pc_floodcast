# Alcácer do Sal (Sado basin) Floodcast domain. Generated by build_domain.py -- do not edit by hand.
# Paths are relative to this file. See README.md for provenance: geometry/soil/land cover are real
# open data; ALL model parameters are UNCALIBRATED defaults.
domain_id = "alcacer_do_sal"
description = "Sado sub-basin draining to the FLUXOS inflow point just upstream of Alcácer do Sal (hydrology outlet == hydraulic inflow) and the hydraulic window around the town"

[outlet]
lat = 38.36867
lon = -8.52207
town_lat = 38.3735
town_lon = -8.5127
area_km2 = 6056.0
mizuroute_outlet_seg_id = 2029
outlet_hru_id = 1029
summa_hru_ids = [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]

[geometry]
hrus = "geometry/hrus.geojson"
basin = "geometry/basin.geojson"
river_network = "geometry/river_network.geojson"
hru_id_field = "hruId"
geometry_version = "sado-at-alcacer-glo30-100m-v1"
expected_hru_ids = [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]
crs = "EPSG:4326"

[bbox]
# Basin bounds padded by 0.25 deg: ECMWF IFS area subset (north/west/south/east, WGS84)
north = 38.90
west = -8.98
south = 37.35
east = -7.47

[summa]
settings_dir = "summa"
attributes = "summa/attributes.nc"
cold_state = "summa/coldState.nc"
file_manager_template = "summa/fileManager.template.txt"
mizuroute_config_template = "summa/mizuroute_config.template.toml"
executable = "summa_sundials_mizuroute.exe"   # coupled build; command: -m fileManager.txt -c mizuroute_config.toml -r e
output_discharge_variable = "Q_reach"          # (time, seg, method) m3 s-1; outlet column = seg == mizuroute.outlet_seg_id
forcing_timestep_seconds = 3600

[mizuroute]
# Internally coupled: read by SUMMA itself (no separate mizuRoute executable or runoff file).
settings_dir = "mizuroute"
topology = "mizuroute/topology.nc"
param_nml = "mizuroute/param.nml.default"
routing_method = "3"   # Eulerian kinematic wave
outlet_seg_id = 2029

[fluxos]
dem = "fluxos/dem_channel.asc"   # Sado channel carved + 10 m datum offset (burn_channel.py)
datum_offset_m = 10.0              # added to sea levels; FLUXOS needs elevations > 0
modset_template = "fluxos/modset.template.json"
crs = "EPSG:32629"
cellsize_m = 20
xllcorner = 539560.0
yllcorner = 4244360.0
ncols = 300
nrows = 300
inflow_xy = [545050.0, 4244410.0]   # river entering the window (south edge)
inflow_wgs84 = [-8.48445, 38.34671]
window_wgs84_bbox = [-8.54728, 38.34652, -8.47823, 38.40030]
# Downstream (estuary) edge for the tide / water-level boundary: the low ground (< 1.5 m) where the
# Sado leaves the window towards Setubal, i.e. the north-west corner. 1-based cell index along the
# edge (west: rows from the south; north: columns from the west). Found from dem.asc on 2026-11-19.
# Needs FLUXOS >= b641613 (zero-initialised state): older builds started some cells next to this
# boundary as NaN, which swallowed the river and could wipe the whole domain.
tide_edges = [
  { EDGE = "west", FROM = 171, TO = 300 },
  { EDGE = "north", FROM = 1, TO = 27 },
]

# Mouth sea level (Open-Meteo marine, 38.47N 8.92W) -> water level at the Alcácer reach, applied to
# the tide boundary (tide.transfer). Fitted 2026-11-20 on 90 days (22 Aug-20 Nov 2026) of the APA
# gauge 23F/01H (SNIRH, UTC stamps, gauge zero -2.18 m): high water = 0.666 + 1.249 x mouth high
# water, 1.69 h later (rmse 0.07 m, n=174); low water = -0.227 + 0.604 x mouth low water, 2.39 h
# later (rmse 0.11 m, n=173); ebb shape fitted on the first 70 %. Hourly rmse on the last 30 %:
# 0.21 m (mouth series as is: 0.78 m). Calibrated at the gauge, so checked with FLUXOS at the gauge.
# The transfer is fitted AT the gauge; the boundary is the estuary edge ~3.5 km downstream, and FLUXOS
# takes ~1 h to carry the tide from there to the gauge (17-19 Nov 2026 check: hourly error at the
# gauge 0.31 m without this lead, 0.18 m with the boundary 1 h earlier). Not refitted daily: it is
# a property of the model geometry, not of the tide.
tide_edge_lead_h = 1.0

# Fallback values; the forecast loop recalibrates these daily (state/tide_transfer.json).
[fluxos.tide_transfer]
hw_scale = 1.249
hw_offset_m = 0.666
hw_lag_h = 1.688
lw_scale = 0.604
lw_offset_m = -0.227
lw_lag_h = 2.39
fall_shape = 0.611

[reference_gauges]
# Verified 2026-11-20 from the SNIRH station sheet (snirh.apambiente.pt, rede Hidrométrica): see [[gauges]].
status = "verified"
stations = ["23F/01H"]

# APA gauges whose real-time level is compared with the FLUXOS prediction on the site (gauges.py).
# Alcácer do Sal 23F/01H: automatic level sensor with telemetry, active since 2001, in the town reach.
# snirh_site = SNIRH internal id; parameter 1843 = "Nível hidrométrico instantâneo" (m above the
# staff-gauge zero, hourly). gauge_zero_m = "COTA ZERO ESCALA" since 13/05/2004 (m, mean sea level).
[[gauges]]
code = "23F/01H"
name = "Alcácer do Sal"
snirh_site = 1627743394
snirh_parameter = 1843
gauge_zero_m = -2.18
lat = 38.370111
lon = -8.506972
radius_m = 60
