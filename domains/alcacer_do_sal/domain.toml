# Alcácer do Sal (Sado basin) Floodcast domain. Generated by build_domain.py -- do not edit by hand.
# Paths are relative to this file. See README.md for provenance: geometry/soil/land cover are real
# open data; ALL model parameters are UNCALIBRATED defaults.
domain_id = "alcacer_do_sal"
description = "Sado sub-basin draining to the FLUXOS inflow point just upstream of Alcácer do Sal (hydrology outlet == hydraulic inflow) and the hydraulic window around the town"

[outlet]
lat = 38.36867
lon = -8.52207
town_lat = 38.3735
town_lon = -8.5127
area_km2 = 6056.0
mizuroute_outlet_seg_id = 2029
outlet_hru_id = 1029
summa_hru_ids = [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]

[geometry]
hrus = "geometry/hrus.geojson"
basin = "geometry/basin.geojson"
river_network = "geometry/river_network.geojson"
hru_id_field = "hruId"
geometry_version = "sado-at-alcacer-glo30-100m-v1"
expected_hru_ids = [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]
crs = "EPSG:4326"

[bbox]
# Basin bounds padded by 0.25 deg: ECMWF IFS area subset (north/west/south/east, WGS84)
north = 38.90
west = -8.98
south = 37.35
east = -7.47

[summa]
settings_dir = "summa"
attributes = "summa/attributes.nc"
cold_state = "summa/coldState.nc"
file_manager_template = "summa/fileManager.template.txt"
mizuroute_config_template = "summa/mizuroute_config.template.toml"
executable = "summa_sundials_mizuroute.exe"   # coupled build; command: -m fileManager.txt -c mizuroute_config.toml -r e
output_discharge_variable = "Q_reach"          # (time, seg, method) m3 s-1; outlet column = seg == mizuroute.outlet_seg_id
forcing_timestep_seconds = 3600

[mizuroute]
# Internally coupled: read by SUMMA itself (no separate mizuRoute executable or runoff file).
settings_dir = "mizuroute"
topology = "mizuroute/topology.nc"
param_nml = "mizuroute/param.nml.default"
routing_method = "3"   # Eulerian kinematic wave
outlet_seg_id = 2029

[fluxos]
dem = "fluxos/dem_channel.asc"   # Sado channel carved + 10 m datum offset (burn_channel.py)
datum_offset_m = 10.0              # added to sea levels; FLUXOS needs elevations > 0
modset_template = "fluxos/modset.template.json"
crs = "EPSG:32629"
cellsize_m = 20
xllcorner = 539560.0
yllcorner = 4244360.0
ncols = 300
nrows = 300
inflow_xy = [545050.0, 4244410.0]   # river entering the window (south edge)
inflow_wgs84 = [-8.48445, 38.34671]
window_wgs84_bbox = [-8.54728, 38.34652, -8.47823, 38.40030]
# Downstream (estuary) edge for the tide / water-level boundary: where the carved Sado channel leaves
# the window towards Setubal (north-west). 1-based cell index along the edge (west: rows from the
# south; north: columns from the west). Only cells whose FLUXOS bed (2x2 mean of dem_channel.asc)
# AND whose first interior neighbour are below 8.8 m (datum; < lowest tide) are used: a tide cell
# next to an interior cell that can dry gave NaN velocities that wiped the whole domain once the
# river reached it (2026-11-20; the old 171-300 / 1-27 edges had 57 such cells).
tide_edges = [
  { EDGE = "west", FROM = 208, TO = 257 },
  { EDGE = "north", FROM = 5, TO = 25 },
]

[reference_gauges]
# No gauge is listed: SNIRH/APA station codes for the Sado at/near Alcácer could not be verified from
# this environment and must not be guessed. Add {name, code, lat, lon} entries once confirmed with APA.
status = "unknown"
stations = []
