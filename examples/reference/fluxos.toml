# Analytic closed-cell storage case; configuration is copied before running.
schema_version = 1
data_root = "../../data"

[run]
model_id = "fluxos"
arguments = ["/work/config/modset.json"]
working_directory = "/work"
timeout_s = 60

[[run.mounts]]
source = "../../tests/integration/hydraulics/cases/subthreshold-storage"
target = "/input"
mode = "ro"

[[run.staged_files]]
source = "../../tests/integration/hydraulics/cases/subthreshold-storage/modset.json"
work_relative_path = "config/modset.json"

[run.resources]
memory_bytes = 536870912
mpi_ranks = 1
omp_threads = 1
