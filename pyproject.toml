[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "floodcast"
version = "0.0.1.dev1"
description = "A framework for reproducible flood forecasting workflows"
requires-python = ">=3.12,<3.15"
# Canonical Python runtime dependencies for both Conda + pip and Pixi.
# Pixi records its transitive versions and artifacts in pixi.lock; pip does not read it.
dependencies = [
    "filelock==3.32.7",
    "pydantic==2.14.2",
]

[project.scripts]
floodcast = "floodcast.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "build>=1.2,<2",
    "setuptools==82.0.1",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
# Lock targets; execution must be verified separately on each host platform.
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.84.1,<0.85"

[tool.pixi.dependencies]
# Keep the tested interpreter aligned with environment.yml.
python = "==3.12.16"

[tool.pixi.pypi-dependencies]
# Git-checkout distribution: install this package and expose the floodcast command.
floodcast = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = [], solve-group = "floodcast" }
dev = { features = ["dev"], solve-group = "floodcast" }

[tool.pixi.tasks]
help = "floodcast --help"

[tool.pixi.feature.dev.tasks]
lint = "ruff check src scripts tests --no-cache"

[tool.pixi.feature.dev.tasks.test]
cmd = "python -B -m pytest -p no:cacheprovider"
# Legacy bootstrap unit tests simulate unactivated shells using fake subprocesses.
# Clear the test runner's activation marker, not the production bootstrap guard.
env = { CONDA_PREFIX = "" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = ["docker: requires an explicitly enabled Docker integration environment"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["floodcast", "helpers"]

[tool.ruff.lint.per-file-ignores]
# Keep audited upstream C++ match/replacement strings byte-for-byte intact.
"scripts/patch_fluxos.py" = ["E501"]
